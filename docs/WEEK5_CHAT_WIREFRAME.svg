<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1840" viewBox="0 0 1200 1840" role="img" aria-labelledby="title description">
  <title id="title">CakeMatch AI Cake Design Assistant wireframe</title>
  <desc id="description">A chat page with three creative intake questions, a personalized cake design idea, a guardrail, human checkpoint, save action, and thumbs feedback.</desc>
  <defs>
    <style>
      .page { fill: #fbf3ed; }
      .panel { fill: #fffaf6; stroke: #e3ccc9; stroke-width: 2; }
      .soft { fill: #f5dfda; stroke: #e3ccc9; stroke-width: 2; }
      .choice { fill: #fffaf6; stroke: #c98e91; stroke-width: 2; }
      .assistant { fill: #fffaf6; stroke: #e3ccc9; stroke-width: 2; }
      .user { fill: #f5dfda; stroke: #e8b9b5; stroke-width: 2; }
      .ink { fill: #39252a; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #7b6768; font-family: Arial, Helvetica, sans-serif; }
      .brand { fill: #642c3a; font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
      .eyebrow { fill: #823f4d; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .heading { fill: #39252a; font-family: Georgia, 'Times New Roman', serif; font-size: 46px; }
      .subheading { fill: #39252a; font-family: Georgia, 'Times New Roman', serif; font-size: 25px; }
      .body { fill: #39252a; font-family: Arial, Helvetica, sans-serif; font-size: 17px; }
      .small { fill: #7b6768; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
      .button { fill: #fffaf6; stroke: #e3ccc9; stroke-width: 2; }
      .primary { fill: #823f4d; }
      .buttonText { fill: #642c3a; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; }
      .primaryText { fill: #fffaf5; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; }
      .sender { fill: #823f4d; font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect class="page" width="1200" height="1840"/>
  <text class="brand" x="90" y="58" font-size="21">CakeMatch <tspan fill="#823f4d">AI</tspan></text>
  <text class="small" x="790" y="57">Home</text>
  <text class="small" x="875" y="57">Core</text>
  <text class="brand" x="945" y="57">Chat</text>
  <text class="small" x="1010" y="57">Documentation</text>
  <line x1="90" y1="88" x2="1110" y2="88" stroke="#e3ccc9" stroke-width="2"/>

  <text class="eyebrow" x="120" y="148">A GUIDED CAKE DESIGN CHAT</text>
  <text class="heading" x="120" y="205">Imagine a cake that feels like you.</text>
  <text class="muted" x="120" y="237" font-size="17">Choose a feeling, a unique detail, and a source of inspiration.</text>

  <rect class="panel" x="120" y="270" width="960" height="1485"/>
  <rect class="soft" x="150" y="295" width="900" height="58"/>
  <text class="brand" x="172" y="321" font-size="14">PRIVACY NOTE</text>
  <text class="small" x="172" y="341">Saved privately in this browser. Clearing browser data may lose the chat. Don’t share sensitive details.</text>

  <rect class="assistant" x="150" y="377" width="580" height="58" rx="12"/>
  <text class="sender" x="170" y="398">CAKEMATCH</text>
  <text class="body" x="170" y="422">Hi! I can help you shape a cake design idea.</text>

  <rect class="assistant" x="150" y="452" width="900" height="154" rx="12"/>
  <text class="sender" x="172" y="476">QUESTION 1 OF 3</text>
  <text class="subheading" x="172" y="508">What feeling do you want your cake to create?</text>
  <rect class="choice" x="172" y="526" width="145" height="46" rx="3"/>
  <text class="buttonText" x="196" y="555">Romantic</text>
  <rect class="choice" x="330" y="526" width="120" height="46" rx="3"/>
  <text class="buttonText" x="369" y="555">Fun</text>
  <rect class="choice" x="463" y="526" width="145" height="46" rx="3"/>
  <text class="buttonText" x="484" y="555">Luxurious</text>
  <rect class="choice" x="621" y="526" width="145" height="46" rx="3"/>
  <text class="buttonText" x="642" y="555">Nostalgic</text>
  <rect class="choice" x="779" y="526" width="145" height="46" rx="3"/>
  <text class="buttonText" x="801" y="555">Surprising</text>

  <rect class="user" x="815" y="617" width="235" height="48" rx="12"/>
  <text class="sender" x="835" y="637">YOU</text>
  <text class="body" x="835" y="657">Romantic</text>

  <rect class="assistant" x="150" y="678" width="900" height="154" rx="12"/>
  <text class="sender" x="172" y="702">QUESTION 2 OF 3</text>
  <text class="subheading" x="172" y="734">What would you like to make your cake unique?</text>
  <rect class="choice" x="172" y="752" width="175" height="46" rx="3"/>
  <text class="buttonText" x="190" y="781">Personal details</text>
  <rect class="choice" x="360" y="752" width="120" height="46" rx="3"/>
  <text class="buttonText" x="396" y="781">Flowers</text>
  <rect class="choice" x="493" y="752" width="120" height="46" rx="3"/>
  <text class="buttonText" x="525" y="781">Textures</text>
  <rect class="choice" x="626" y="752" width="190" height="46" rx="3"/>
  <text class="buttonText" x="642" y="781">Special decorations</text>
  <rect class="choice" x="829" y="752" width="190" height="46" rx="3"/>
  <text class="buttonText" x="845" y="781">Creative shape</text>

  <rect class="user" x="815" y="843" width="235" height="48" rx="12"/>
  <text class="sender" x="835" y="863">YOU</text>
  <text class="body" x="835" y="883">Flowers</text>

  <rect class="assistant" x="150" y="904" width="900" height="154" rx="12"/>
  <text class="sender" x="172" y="928">QUESTION 3 OF 3</text>
  <text class="subheading" x="172" y="960">Where would you like to find inspiration for your cake?</text>
  <rect class="choice" x="172" y="978" width="170" height="46" rx="3"/>
  <text class="buttonText" x="191" y="1007">Pinterest idea</text>
  <rect class="choice" x="355" y="978" width="210" height="46" rx="3"/>
  <text class="buttonText" x="372" y="1007">Favorite color palette</text>
  <rect class="choice" x="578" y="978" width="170" height="46" rx="3"/>
  <text class="buttonText" x="596" y="1007">Personal memory</text>
  <rect class="choice" x="761" y="978" width="170" height="46" rx="3"/>
  <text class="buttonText" x="781" y="1007">Special theme</text>

  <rect class="user" x="815" y="1069" width="235" height="48" rx="12"/>
  <text class="sender" x="835" y="1089">YOU</text>
  <text class="body" x="835" y="1109">Personal memory</text>

  <rect class="soft" x="150" y="1132" width="900" height="215"/>
  <text class="eyebrow" x="178" y="1164">YOUR PERSONALIZED CAKE DESIGN</text>
  <text class="subheading" x="178" y="1201">A romantic cake with flowers</text>
  <text class="body" x="178" y="1232">Let your personal memory guide the colors and small details.</text>
  <text class="body" x="178" y="1261">Keep a floral focal point and soft, romantic lines to connect the mood</text>
  <text class="body" x="178" y="1286">with your inspiration. A cake designer can adapt this starting idea.</text>
  <rect class="button" x="178" y="1301" width="190" height="36" rx="3"/>
  <text class="buttonText" x="200" y="1324">Copy design brief</text>

  <rect class="assistant" x="150" y="1367" width="900" height="174"/>
  <text class="subheading" x="178" y="1404">Need a next step?</text>
  <text class="small" x="178" y="1431">For allergies, feasibility, prices, availability, and orders, ask a cake designer directly.</text>
  <rect class="choice" x="178" y="1450" width="190" height="42" rx="3"/>
  <text class="buttonText" x="192" y="1477">Allergies or safety</text>
  <rect class="choice" x="379" y="1450" width="206" height="42" rx="3"/>
  <text class="buttonText" x="395" y="1477">Can this be made?</text>
  <rect class="choice" x="596" y="1450" width="153" height="42" rx="3"/>
  <text class="buttonText" x="615" y="1477">Price or quote</text>
  <rect class="choice" x="760" y="1450" width="166" height="42" rx="3"/>
  <text class="buttonText" x="777" y="1477">Availability</text>
  <text class="small" x="178" y="1522">Also available: Place an order · Something else</text>

  <rect class="soft" x="150" y="1560" width="900" height="82"/>
  <text class="brand" x="178" y="1591" font-size="14">HUMAN CHECKPOINT</text>
  <text class="small" x="178" y="1618">Starting idea only — confirm ingredients, allergy precautions, feasibility, price, and availability with a baker.</text>

  <rect class="primary" x="150" y="1663" width="180" height="54" rx="2"/>
  <text class="primaryText" x="191" y="1697">Save design</text>
  <text class="small" x="350" y="1685">Was this design idea helpful?</text>
  <rect class="button" x="575" y="1663" width="110" height="48" rx="2"/>
  <text class="buttonText" x="593" y="1693">👍 Yes</text>
  <rect class="button" x="700" y="1663" width="110" height="48" rx="2"/>
  <text class="buttonText" x="718" y="1693">👎 No</text>
  <text class="small" x="150" y="1788">CakeMatch AI — Project created by Camila Gutiérrez</text>
  <text class="small" x="950" y="1788">AI-Native Builder 2026</text>
</svg>
